<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 4 90 36" role="img" aria-label="Digital Wallet">
  <defs>
    <linearGradient id="wlt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Wallet body -->
  <rect x="4" y="8" width="34" height="28" rx="5" fill="url(#wlt-grad)"/>
  <!-- Flap -->
  <rect x="4" y="8" width="34" height="11" rx="5" fill="#1e3a8a"/>
  <rect x="4" y="14" width="34" height="5" fill="#1e3a8a"/>
  <!-- Pocket -->
  <rect x="26" y="14" width="14" height="14" rx="3" fill="#fff" opacity="0.18"/>
  <circle cx="33" cy="21" r="4" fill="#FCD34D"/>
  <!-- Label -->
  <text xml:lang="ar" x="46" y="20" font-family="Arial, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#1e40af">&#x645;&#x62D;&#x641;&#x638;&#x629;</text>
  <text x="46" y="35" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Wallet</text>
</svg>
